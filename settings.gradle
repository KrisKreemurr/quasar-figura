pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Quasar MC: single NeoForge project. Sources still live in common/ and neoforge/
// (same layout as upstream, so upstream changes merge cleanly); build.gradle compiles both.
// The fabric/, forge/ and common/mojmap/ folders are not part of this build.
rootProject.name = 'quasar-figura'
