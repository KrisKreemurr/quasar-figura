# Quasar MC: builds the NeoForge 26.3 jar on every push.
name: Build (NeoForge 26.3)
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Porting probe (class names / signatures)
        if: always()
        run: bash .quasar/probe.sh

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: figura-quasar-neoforge
          path: build/libs/*.jar
