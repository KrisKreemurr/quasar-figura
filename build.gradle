// Quasar MC build of Figura for NeoForge 26.3.
// Replaces upstream's Architectury multi-loader build with a single ModDevGradle project.

plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}+${minecraft_version}-quasar"
group = maven_group
base.archivesName = 'figura-quasar'

// Minecraft 26.x requires Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Compile upstream's common/ code and the neoforge/ glue together as one mod.
sourceSets.main {
    java.srcDirs = ['common/src/main/java', 'neoforge/src/main/java']
    resources.srcDirs = ['common/src/main/resources', 'neoforge/src/main/resources']
    resources.exclude 'figura.accesswidener', 'architectury.common.json', 'fabric.mod.json'
    // GeckoLib armor integration needs GeckoLib at compile time; left out until GeckoLib has a 26.3 build.
    java.exclude '**/mixin/compat/Geckolib*', '**/ducks/GeckolibGeoArmorAccessor.java'
    // TODO(quasar): render-callback mixins for vanilla models/items/flames/name tags, not yet ported to 26.3's
    // feature renderers (also removed from figura-common.mixins.json). See SubmitNodeCollectionMixin.
    java.exclude '**/mixin/render/feature/ModelFeatureRendererMixin.java', '**/mixin/render/feature/ModelPartFeatureRendererMixin.java',
            '**/mixin/render/feature/ItemFeatureRendererMixin.java', '**/mixin/render/feature/FlameFeatureRendererMixin.java',
            '**/mixin/render/feature/NameTagFeatureRenderer$StorageMixin.java', '**/mixin/render/feature/NameTagFeatureRendererMixin.java',
            '**/mixin/render/feature/FeatureRendererDispatcherMixin.java', '**/mixin/render/nodeRenderer/SubmitNodeStorage$*SubmitMixin.java',
            '**/ducks/NameTagFeatureRenderer$StorageExtension.java'
}

repositories {
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.FiguraMC.luaj' }
    }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    // Converted from upstream's Fabric access widener (common/src/main/resources/figura.accesswidener).
    accessTransformers = files('neoforge/src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
    }

    mods {
        figura {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Libraries bundled inside the Figura jar (jar-in-jar).
    jarJar(implementation("com.github.FiguraMC.luaj:luaj-core:${luaj}-figura"))
    jarJar(implementation("com.github.FiguraMC.luaj:luaj-jse:${luaj}-figura"))
    jarJar(implementation("com.neovisionaries:nv-websocket-client:${nv_websocket}"))

    // MixinExtras ships with NeoForge at runtime; this is only for compiling.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
}

tasks.named('processResources', ProcessResources) {
    def props = [
            version          : project.version.toString(),
            minecraft_version: project.minecraft_version,
            assets_version   : project.assets_version,
            java_version     : '25',
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Show every compile error, not just the first 100 (useful while porting).
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

// After every build, copy the jar into the MultiMC test instance (quasarmc_test_mods_dir).
def installJar = tasks.register('installToTestInstance', Copy) {
    def target = providers.gradleProperty('quasarmc_test_mods_dir')
    onlyIf { target.isPresent() && new File(target.get()).isAbsolute() && new File(target.get()).exists() }
    from tasks.named('jar')
    into target.orElse(layout.buildDirectory.dir('no-test-dir').get().asFile.path)
}
tasks.named('build') { finalizedBy installJar }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
