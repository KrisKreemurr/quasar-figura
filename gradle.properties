# Quasar MC build of Figura: NeoForge only, Minecraft 26.3.
# (Upstream's multi-loader Architectury setup is replaced by ModDevGradle on this branch.)

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment
minecraft_version=26.3
# Pinned to the same NeoForge build as the Quasar MC test instance.
neo_version=26.3.0.115

# Mod
mod_version=0.1.6
maven_group=org.figuramc
assets_version=v2

# Libraries
# https://github.com/FiguraMC/luaj
# https://github.com/TakahikoKawasaki/nv-websocket-client
luaj=3.0.8
nv_websocket=2.14

# After every build, copy the jar into the MultiMC test instance.
# Anyone else can override this in their own %USERPROFILE%\.gradle\gradle.properties
quasarmc_test_mods_dir=G:/MultiMC/instances/26.3/.minecraft/mods
